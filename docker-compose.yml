services:
  busfind:
    build: .
    image: busfind:latest
    ports:
      - "8000:8000"
    environment:
      BUSFIND_PORT: "8000"
      # BUSFIND_OFFLINE: "1"   # демо на локальном снимке, без efa.vgn.de
      # BUSFIND_TIMEOUT: "12"  # таймаут запросов к EFA, сек
      # EFA_URL: "https://efa.vgn.de/xml/"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
